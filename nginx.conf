server {
    listen 80;
    server_name gm.teckapp.ovh localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Supporto per SPA React: reindirizza tutto su index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache per asset statici (JS/CSS/fonts)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
